aid: hostnfly
name: HostnFly
description: >-
  HostnFly is a French short-term-rental (Airbnb) concierge and property-management
  company, founded in 2016 and headquartered in Paris. It manages the full lifecycle
  of short-stay rentals on behalf of property owners: listing creation and optimization,
  multi-platform distribution (Airbnb, Booking.com, Abritel), guest screening and 24/7
  communication, check-in/check-out and key handling, hotel-grade housekeeping and linen,
  maintenance, short-term-rental insurance, and dynamic revenue optimization. HostnFly
  operates on a commission-only model (from ~20% of nightly revenue, no fixed fees) and
  covers 340+ cities across metropolitan France and Corsica. It is a Partech portfolio
  company. HostnFly publishes an llms.txt agent-discovery file but does not expose a
  public developer API, SDKs, or OpenAPI at this time.
